<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search for lost pets</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1.2.1/dist/ml5.min.js"></script>
</head>
<body>    
    <div id="header">
        <h1>Search for Lost Pets</h1>
    </div>
    <div id="pattern-container">
        <h2>Search by Pattern:</h2>
        <select name="pattern" id="pattern"></select>
    </div>
    <div id="color-container">
        <h2>Search by Color:</h2>
        <select name="color" id="color"></select>
    </div>
    <div id="breed-container">
        <h2>Search by Breed:</h2>
        <select name="breed" id="breed"></select>
    </div>
    <div id="upload-container">
        <h2>Search by Image</h2>
        <input type="file" id="upload" name="upload" accept="image/*">
        <img id="inputImage" src="" alt="Image will appear here" width="300" style="display:none;">
        <p id="result"></p>
    </div>
    <div id="pets-container">
    </div>
    <script src="script.js"></script>
</body>
</html>
